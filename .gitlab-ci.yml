image: node:latest

build:
  stage: build
  script:
    # Set up Elm
    - mkdir elm-setup
    - cd elm-setup
    - curl -L -o elm.gz https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz
    - gunzip elm.gz
    - chmod +x elm
    - mv elm /usr/local/bin/
    - cd ../web
    # Build
    - elm make src/Main.elm --output=assets/elm.js
    # Copy translations
    - cp -r translations assets/
  artifacts:
    paths:
    - web/assets
